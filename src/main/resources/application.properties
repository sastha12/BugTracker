spring.application.name=Bugtracker

# =========================================================
# 1. DATABASE CONFIGURATION (FIXED FOR RENDER DEPLOYMENT)
# The error was caused by using DB_HOST and DB_PORT separately.
# Render provides the full URL in DB_URL (or similar variable).
# =========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Specify the MySQL Dialect directly to help Hibernate initialize faster.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =========================================================
# 2. SECURITY FIX (EMAIL CREDENTIALS)
# Replaced hardcoded password with Environment Variable for security.
# You MUST set these variables in the Render Dashboard.
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sasthasastha4@gmail.com
spring.mail.password=bits xnxg ytvw ifsm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================================================
# 3. OTHER CONFIGURATIONS
# =========================================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.port=8080
